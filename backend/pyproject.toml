[build-system]
requires = ["setuptools==84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "mystreetvendor-backend"
version = "0.1.0"
description = "MyStreetVendor Phase 1 backend foundation"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi==0.157.0",
    "pydantic==2.14.1",
    "pydantic-settings==2.16.1",
    "SQLAlchemy==2.1.5",
    "alembic==1.20.0",
    "psycopg[binary]==3.3.6",
    "uvicorn==0.54.0",
    "pwdlib[argon2]==0.3.1",
    "PyJWT==2.15.1",
    "email-validator==2.3.0",
    "GeoAlchemy2==0.20.0",
]

[project.optional-dependencies]
test = ["pytest==9.1.1", "httpx2==2.16.0"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
markers = ["integration: uses a disposable real PostgreSQL/PostGIS database"]
